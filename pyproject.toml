[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketsim-hpc"
version = "0.1.0"
description = "A private HPC stock trend forecasting simulator using Monte Carlo simulation and real market data."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["marketsim*", "cli*", "backend*", "cluster*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
